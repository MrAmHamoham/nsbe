name: Build Java Gradle Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch code from the current repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Change to '11', '8', or '21' if required by your build
          distribution: 'temurin'

      # 3. Setup Gradle (handles caching & Wrapper execution)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Grant execution permission to the Gradle Wrapper (if gradlew exists)
      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      # 5. Build the project using Gradle Wrapper or installed Gradle
      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      # 6. Upload built JAR/WAR files as artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NSBE-artifacts
          path: build/libs/
